[project]
name = "wms-bodegas"
version = "0.1.0"
description = "Sistema de gestion de bodegas, inventario, lotes, QR y procesos productivos"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=42",
    "segno>=1.6",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2"]
mysql = ["pymysql>=1.1"]
sqlserver = ["pyodbc>=5.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
wms = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]
